# Contenedores solo para ejecutar las pruebas y revisiones de calidad (no levantan la app).
# No necesitan backend/.env ni PostgreSQL: las pruebas usan SQLite en memoria.
#
# Uso (desde la raíz del repositorio):
#   docker compose -f docker-compose.test.yml run --rm backend-tests
#   docker compose -f docker-compose.test.yml run --rm frontend-tests
services:
  backend-tests:
    build: ./backend
    working_dir: /app
    environment:
      JWT_SECRET_KEY: clave-solo-para-pruebas
      LOG_LEVEL: WARNING
    volumes:
      - ./backend:/app
    command: pytest -q

  frontend-tests:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules vive en un volumen de Docker para no mezclar binarios de Linux
      # con los de tu sistema.
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm test"

volumes:
  frontend_node_modules:
